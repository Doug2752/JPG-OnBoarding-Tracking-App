<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JPG — 14-Day Tracking Log</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; overflow-x: hidden; }
    body { background: #B8860B; }
    input:focus, textarea:focus, select:focus { outline: 2px solid #B8860B; outline-offset: 1px; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #B8860B; border-radius: 2px; }
    img { max-width: 100%; height: auto; }
    @media (max-width: 480px) { input, textarea, select { font-size: 16px !important; } }
    input[type=checkbox] { width: auto !important; height: auto !important; }
    input[type=number]::-webkit-inner-spin-button { opacity: 0.5; }
    optgroup { font-weight: 700; color: #333; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
